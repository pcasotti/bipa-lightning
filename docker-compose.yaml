services:
  db:
    image: postgres:17
    container_name: bipa-lightning-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: nodes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: bipa-lightning-app
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/nodes
      LISTEN_ADDR: 0.0.0.0:3000
      UPDATE_INTERVAL_SECS: 30
      MEMPOOL_URL: https://mempool.space/api/v1/lightning/nodes/rankings/connectivity
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata: